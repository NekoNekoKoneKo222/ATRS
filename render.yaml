services:
  - type: web
    name: astral-archive
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node apps/client/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.0

# Firebase（アカウント＋Firestoreのクラウドセーブ）を使う場合は
# Render Dashboard > Environment に VITE_FIREBASE_API_KEY,
# VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
# を登録し、ビルドし直してください。これらはブラウザ公開用の設定値です。
# 旧Supabaseの VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY は任意で残せます
# （WORKSHOP と Firebase未設定時の既存アカウント／セーブ向け）。
# 無料プランの制限・ルール導入方法: docs/firebase-setup.md

